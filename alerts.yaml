apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: gpu
      rules:
        # Xid is the GPU's own error channel. No "for" clause: a single Xid is
        # worth waking up for, and the counter can clear on driver reload, so
        # waiting five minutes can mean missing it entirely.
        - alert: GPUXidError
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          labels:
            severity: critical
          annotations:
            summary: "Xid {{ $value }} on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
            description: >-
              Capture nvidia-bug-report.sh before any reset or reboot, then
              drain. A reset clears the evidence.

        # Busy but slow. Utilization alone will not show this: the GPU looks
        # fully occupied while the clock is capped by power or heat.
        # Set the threshold from the node's own baseline under load, per GPU
        # model. 1200 suits an L40S; an H100 SXM baseline sits much higher.
        - alert: GPUClocksLowUnderLoad
          expr: DCGM_FI_DEV_GPU_UTIL > 80 and DCGM_FI_DEV_SM_CLOCK < 1200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.Hostname }} GPU {{ $labels.gpu }} throttled under load"
            description: >-
              Check power limit and thermals. Customers see this as a slow job
              with no errors anywhere.

        # Without this the two rules above fail silently: no metrics means no
        # firing, which looks identical to a healthy fleet.
        - alert: DCGMExporterDown
          expr: up{job=~".*dcgm.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "DCGM exporter down on {{ $labels.instance }}"
            description: "GPU telemetry is blind while this is firing."
